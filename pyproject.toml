[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forkwatch"
version = "0.1.0"
description = "Dependabot-style alerts when an Ethereum hard fork breaks assumptions in your contracts and off-chain code"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
forkwatch = "forkwatch.cli:main"

[tool.setuptools.packages.find]
include = ["forkwatch*"]

[tool.setuptools.package-data]
forkwatch = ["data/*.yaml", "data/advisories/*.yaml"]
